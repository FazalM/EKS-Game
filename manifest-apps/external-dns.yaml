apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.14.4
    helm:
      releaseName: external-dns
      values: |
        provider: aws
        registry: txt
        txtOwnerId: "superstareducation"
        domainFilters:
          - superstareducation.co.uk
        policy: upsert-only
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::662348578823:role/eks-external-dns-irsa-role
        extraArgs:
          - --aws-zone-type=public
        logLevel: info
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
