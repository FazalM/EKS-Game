apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-application-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - superstareducation.co.uk
      secretName: superstareducation-co-uk-tls
  rules:
    - host: superstareducation.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-application-svc
                port:
                  number: 80

